name: AL-thmany Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    name: Verify, Test, Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore stable debug signing key when available
        shell: bash
        env:
          ALTHMANY_DEBUG_KEYSTORE_B64: ${{ secrets.ALTHMANY_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ALTHMANY_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p debug-signing
            printf '%s' "$ALTHMANY_DEBUG_KEYSTORE_B64" |
              base64 --decode > debug-signing/althmany-debug.jks
            test -s debug-signing/althmany-debug.jks
            echo "Stable debug signing key restored"
          else
            echo "No stable signing key configured."
            echo "Gradle will use the standard Android debug signer."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android platform 36
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Verify Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          sdkmanager --list_installed | grep -E \
            'platforms;android-36|build-tools;35.0.0|platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Kotlin CLI
        shell: bash
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin 2.3.21
          echo "$HOME/.sdkman/candidates/kotlin/current/bin" >> "$GITHUB_PATH"

      - name: Validate source and resources
        shell: bash
        run: |
          python3 scripts/validate_source.py

      - name: Validate integrated Extractor workspace
        shell: bash
        run: |
          python3 scripts/validate_integrated_extractor.py
          bash scripts/run_integrated_extractor_pure_checks.sh

      - name: Run AL-thmany 4.0 focused stability checks
        shell: bash
        run: |
          SKIP_LEGACY=1 bash scripts/run_stability_4_0_checks.sh

      - name: Compile pure Kotlin domain
        shell: bash
        run: |
          bash scripts/compile_pure_kotlin.sh

      - name: Run pure Kotlin regression scenarios
        shell: bash
        run: |
          bash scripts/run_pure_kotlin_regressions.sh

      - name: Run Smart Runtime micro-benchmark
        shell: bash
        run: |
          bash scripts/run_runtime_benchmarks.sh

      - name: Verify Gradle project
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            projects

      - name: Run unit tests
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "======================================"
          echo " APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: al-thmany-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 30
