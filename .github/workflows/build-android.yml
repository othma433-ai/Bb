name: AL-thmany 4.0 - Verify Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: al-thmany-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify, Test, Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout AL-thmany
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed

      - name: Make scripts executable
        shell: bash
        run: |
          find scripts -type f -name "*.sh" -exec chmod +x {} \; || true

      - name: Validate AL-thmany source
        shell: bash
        run: |
          python3 scripts/validate_source.py

      - name: Validate integrated Extractor
        shell: bash
        run: |
          python3 scripts/validate_integrated_extractor.py

      - name: Validate Android XML resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = list(Path("app/src").rglob("*.xml"))
          errors = []

          for file in files:
              try:
                  ET.parse(file)
              except Exception as exc:
                  errors.append((file, exc))

          if errors:
              for path, error in errors:
                  print(f"FAIL: {path}: {error}")
              raise SystemExit(1)

          print(f"XML_PARSE_PASS: {len(files)} files")
          PY

      - name: Gradle dependency and project check
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            projects

      - name: Run Android unit tests
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            testDebugUnitTest

      - name: Run Android Lint
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            lintDebug

      - name: Build AL-thmany 4.0 Debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=========================================="
          echo "APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload AL-thmany APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-4.0-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-4.0-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 30
